# Exemple de définition de chaîne. À adapter aux jeux de données réels.
# {period} / {year} / {month} sont remplacés par la période du run (ex. 2026-10).
chain: air_quality

indicator:
  name: air_quality
  weights:            # somme pondérée des valeurs communales de chaque source
    no2: 0.6
    pm10: 0.4
  thresholds: [10, 20, 30, 40]   # 4 seuils -> niveaux OPF 0 (bon) à 4 (mauvais)

# Limites communales : téléchargées (open data, contours simplifiés à 1 km), puis simplement vérifiées à chaque
# exécution (ETag / Last-Modified) : on ne retélécharge que si le fichier a changé sur le serveur.
# Pour IGN ADMIN_EXPRESS déjà présent en local : `path: data/inputs/ADMIN-EXPRESS.gpkg` et les champs
# par défaut (code_insee, nom_officiel, code_insee_du_departement).
boundaries:
  url: https://etalab-datasets.geo.data.gouv.fr/contours-administratifs/latest/geojson/communes-1000m.geojson
  code_field: code
  name_field: nom
  department_field: departement
  departments: ["31"]           # vide = toute la France (long)
  refresh: if_changed           # never : utiliser la copie locale sans interroger le serveur

sources:
  no2:
    method: zonal_mean
    path: data/inputs/no2_{period}.tif
    condition: "data > 0"
  pm10:
    method: nearest_station
    url: https://example.org/stations/pm10_{year}_{month}.csv
    field: pm10
    dims: [longitude, latitude]
    condition: "valid == 1"

# Une implémentation (`use`) par étape ; `save` et `distribute` valent `none` si omis.
steps:
  fetch:
    use: configured_sources
    params:
      cache_dir: cache            # téléchargements conservés d'une exécution à l'autre (défaut : cache)
  read:
    use: commune_aggregation
  calculate:
    use: weighted_sum
  save:
    use: none
  build:
    use: map_files
    params:
      formats: [gpkg, geojson, kml, pmtiles]
  distribute:
    use: local_folder
    params:
      directory: output
