# Exécution d'une chaîne : calcul sur le runner GitHub, publication dans S3, indicateurs dans PostgreSQL (Neon).
# Configuration (Settings > Secrets and variables > Actions) : voir docs/DEPLOIEMENT-GITHUB-ACTIONS.md.
name: Exécuter une chaîne
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Définition de la chaîne"
        required: true
        default: configs/smoke.yaml
      period:
        description: "Période : AAAA-MM, previous-month ou current-month"
        required: true
        default: previous-month
      sample_data:
        description: "Générer des mesures synthétiques (chaîne de test uniquement)"
        type: boolean
        default: true
  # Activer la planification une fois une chaîne réelle prête (le 5 de chaque mois, 06:00 UTC) :
  # schedule:
  #   - cron: "0 6 5 * *"

permissions:
  contents: read

# Une seule exécution à la fois par chaîne et par période.
concurrency:
  group: chaine-${{ inputs.config }}-${{ inputs.period }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      LUCIOLES_S3_BUCKET: ${{ vars.LUCIOLES_S3_BUCKET }}
      LUCIOLES_DATABASE_URL: ${{ secrets.LUCIOLES_DATABASE_URL }}
      LUCIOLES_SAVE: ${{ secrets.LUCIOLES_DATABASE_URL != '' && 'postgres' || 'none' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[s3]"
      - name: Migrer la base
        if: ${{ env.LUCIOLES_SAVE == 'postgres' }}
        run: lucioles db migrate
      - name: Données synthétiques
        if: ${{ inputs.sample_data }}
        run: lucioles sample-data --period "${{ inputs.period }}"
      - name: Exécuter la chaîne
        run: lucioles run --config "${{ inputs.config }}" --period "${{ inputs.period }}" -v
      - name: Conserver l'espace de travail en cas d'échec
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: workspace/
          retention-days: 3
