[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucioles-processing"
version = "0.1.0"
description = "Chaîne de traitement industrielle des indicateurs environnementaux Lucioles / Open Planet Facts"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "geopandas",
    "scipy",
    "xarray",
    "netCDF4",
    "rasterio",
    "simplekml",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
lucioles = "lucioles_processing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lucioles_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
